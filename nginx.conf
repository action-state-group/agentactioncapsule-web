server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Emit relative Location headers. Behind the platform proxy nginx sees port 8080, so an
    # absolute redirect pointed browsers at http://<host>:8080/..., which does not answer.
    absolute_redirect off;

    # Pretty URLs: /docs/ and /docs -> /docs/index.html; /docs/page -> /docs/page.html
    # ($uri/index.html resolves the directory index reliably; bare $uri/ left it empty in prod)
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    # Vocab rename (2026-08-24): anchor -> witness. Redirect the old doc path so it's
    # never a dead link; docs/anchor-anywhere.html also ships as a meta-refresh stub
    # as a static-hosting safety net if this rule isn't the frontend in play.
    location = /docs/anchor-anywhere {
        return 301 /docs/witness-anywhere.html;
    }
    location = /docs/anchor-anywhere.html {
        return 301 /docs/witness-anywhere.html;
    }

    # CPB moved out to its own site (2026-09-02): AAC is one registrant among
    # peers on CPB, not its host. Redirect old inbound links (I-D, issues) out.
    location = /cpb.html { return 301 https://canonicalpayloadbinding.org/; }
    location = /cpb      { return 301 https://canonicalpayloadbinding.org/; }

    # Evaluator page held until the evaluators blog is published (2026-09-26).
    # 302, not 301: the page comes back (source kept on branch evaluators-held).
    # absolute_redirect off: behind Cloud Run a relative return is expanded to
    # http://<host>:8080/..., so send a bare "Location: /" instead.
    # The playground has not shipped; send its URL to the live interactive page until it does.
    location = /playground      { absolute_redirect off; return 302 /docs/explore.html; }
    location = /playground.html { absolute_redirect off; return 302 /docs/explore.html; }
    location = /for-evaluators      { absolute_redirect off; return 302 /; }
    location = /for-evaluators.html { absolute_redirect off; return 302 /; }

    # The witness directory's short URL (agentactioncapsule.org/witnesses).
    location = /witnesses      { absolute_redirect off; return 301 /docs/witnesses.html; }
    location = /witnesses.html { absolute_redirect off; return 301 /docs/witnesses.html; }

    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HTML must always revalidate — the custom-domain edge (Google Frontend) was
    # serving stale .html after deploys (the quickstart fix shipped to run.app but
    # agentactioncapsule.org kept serving the old cached page). no-store on HTML
    # forces fresh content; static assets can still be cached normally.
    location ~* \.(html|xml|txt)$ {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
