# SPDX-License-Identifier: Apache-2.0
# Served JSON Schemas must be byte-identical to their pinned upstream files.
# tools/check_schemas.py compares each file under schemas/ to data/schemas-pin.json and, with
# --upstream, fetches the file at its pinned repo and commit. Runs on pull_request (no secrets).
name: schemas

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Served schemas match their pins and pinned upstream commits
        run: python tools/check_schemas.py --upstream
